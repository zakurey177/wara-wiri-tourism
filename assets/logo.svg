<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <defs>
    <linearGradient id="burgundyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#800020" />
      <stop offset="50%" stop-color="#6B1D2F" />
      <stop offset="100%" stop-color="#4A0E17" />
    </linearGradient>
    <linearGradient id="planeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E56B6F" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#800020" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Emblem Background / Island silhouette -->
  <g transform="translate(6, 6)" filter="url(#glow)">
    <!-- Island / Atoll Base Silhouette -->
    <rect width="48" height="48" rx="14" fill="url(#burgundyGrad)" />
    
    <!-- Island Landmass contour -->
    <path d="M 12 36 C 16 32, 22 35, 27 31 C 32 27, 38 29, 42 36 C 40 40, 20 42, 12 36 Z" fill="#9E2A47" opacity="0.6"/>
    <path d="M 15 35 C 19 31, 25 33, 29 29 C 33 26, 37 30, 39 35 Z" fill="#D47385" opacity="0.4"/>
    
    <!-- Contrail Arc crossing over the island -->
    <path d="M 8 38 Q 22 28, 38 12" fill="none" stroke="#F4E8EA" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 3" opacity="0.85"/>
    <path d="M 14 36 Q 25 26, 40 14" fill="none" stroke="url(#planeGrad)" stroke-width="1.5" opacity="0.9"/>
    
    <!-- Modern Sleek Airplane silhouette cutting across -->
    <g transform="translate(32, 10) rotate(-35) scale(0.9)">
      <!-- Fuselage -->
      <path d="M 0 -8 C 1 -4, 2 6, 2 12 L -2 12 C -2 6, -1 -4, 0 -8 Z" fill="#FFFFFF"/>
      <!-- Main Wings -->
      <path d="M 0 0 L 11 7 L 11 9 L 0 5 L -11 9 L -11 7 Z" fill="#FFFFFF"/>
      <!-- Tail Wing -->
      <path d="M 0 9 L 5 13 L 5 14 L 0 12 L -5 14 L -5 13 Z" fill="#FFFFFF"/>
      <!-- Cockpit tip accent -->
      <circle cx="0" cy="-6" r="1.2" fill="#E56B6F" />
    </g>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(64, 15)">
    <text x="0" y="20" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="800" fill="#6B1D2F" letter-spacing="-0.5">
      Wara<tspan fill="#800020">Wiri</tspan>
    </text>
    <text x="0" y="34" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="600" fill="#718096" letter-spacing="1.8">
      E-TOURISM • PARIWISATA
    </text>
  </g>
</svg>
